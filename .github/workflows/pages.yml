name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: pages
  cancel-in-progress: false


jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Extract portfolio
        run: |
          cat portfolio.zip.part-* > portfolio.zip
          echo "41a35c382881012dba58779c00f5a06f4dfcc2f30fe035c4e7efaf4b692a2f50  portfolio.zip" | sha256sum -c -
          unzip -q portfolio.zip -d site
          if [ -f portfolio-updates.zip ]; then
            unzip -oq portfolio-updates.zip -d site
          fi
          test -f site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

